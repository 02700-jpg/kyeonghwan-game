name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/kyeonghwan-game.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kyeonghwan-game-apk
          path: build/kyeonghwan-game.apk
          if-no-files-found: error
